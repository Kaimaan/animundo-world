name: Check content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the schema checker
        run: pip install --quiet jsonschema==4.23.0
      - name: Every JSON file is valid JSON
        run: |
          status=0
          for f in $(git ls-files '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; status=1; }
          done
          exit $status
      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.2-linux-x64
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libgl1 libegl1 > /dev/null
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sL https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
          fi
          ~/blender/blender --version | head -1
      - name: Build models
        env:
          BLENDER: /home/runner/blender/blender
        run: tools/build_model.sh models/*.json models/plants/*.json $(ls models/trees/*.json 2>/dev/null)
      - name: Build the body-plan examples
        env:
          BLENDER: /home/runner/blender/blender
          BUILD_OUT: models/examples/previews
        run: tools/build_model.sh models/examples/*.json
      - name: Check places
        run: python3 tools/validate_region.py
      - name: Check against the schemas
        run: python3 tools/check_schemas.py
      - name: homes/ is made from biomes/ (game proposal 0043)
        run: python3 tools/biomes.py flatten --check
      - name: Check the home templates
        run: python3 tools/homes.py check
      - name: Food is worked out from what grows and lives there (game proposal 0043)
        run: python3 tools/food.py report
      - name: Food tests
        run: python3 tools/test_food.py
      - name: Check the animal list
        run: python3 tools/animal_list.py --check
      - name: Check the place list
        run: python3 tools/places.py --check
      - name: Map animals match the list and have Finnish names
        run: python3 tools/map_animals.py --check
      - name: Adapt reference models (every example in models/examples/edits)
        env:
          BLENDER: /home/runner/blender/blender
        run: |
          for edits in models/examples/edits/*.json; do
            ref=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['reference'])" "$edits")
            name=$(basename "$edits" .json)
            python3 tools/adapt_model.py "models/$ref.json" "$edits" --out "/tmp/${name}_example.json"
            BUILD_OUT=/tmp tools/build_model.sh "/tmp/${name}_example.json"
          done
      - name: Adapt home templates (every example in homes/examples)
        run: |
          for h in homes/examples/*.json; do
            python3 tools/adapt_home.py homes/boreal_forest.json "$h" --check --out /tmp/home.json || exit 1
          done
      - name: Example homes have one water level and their height
        run: python3 tools/test_adapt_home.py
      - name: Adapted models reach their sizes and marks
        run: python3 tools/test_adapt_model.py
      - name: Check animals and translations
        run: python3 tools/check_animals.py
      - name: One real species, one file
        run: python3 tools/check_taxa.py
      - name: Check built models
        run: python3 tools/check_models.py
      - name: A whole draft is checked at once
        run: python3 tools/test_check_draft.py
      - name: A tile is checked like a place
        run: python3 tools/test_check_tile.py
      - name: One converter makes a tile's place, as the game does (golden places)
        run: python3 tools/test_tile_region.py
      - name: The checks catch broken content
        run: python3 tools/test_broken.py
      - name: Catalogue is up to date
        run: if [ -f tools/catalogue.py ]; then python3 tools/catalogue.py --check; fi
