# Closes pull requests that aren't from verified players, change files outside
# the content folders, or go over two open pull requests per person (ten for
# the builder bot, whose pull requests come from families' submitted places).
# Runs on pull_request_target so it can comment on PRs from forks. It never
# checks out or runs the PR's code: it only reads the PR's file list.
name: Contributor gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const BOT = 'animundo-builder[bot]';   // the GitHub App that opens pull requests for submitted places
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { owner, repo } = context.repo;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)) return;

            const close = async (why) => {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: why });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
              core.notice(`Closed #${pr.number}: ${why}`);
            };

            const list = await github.rest.repos.getContent({ owner, repo, path: '.github/contributors.txt', ref: pr.base.ref });
            const allowed = Buffer.from(list.data.content, 'base64').toString()
              .split('\n').map(l => l.trim().toLowerCase()).filter(l => l && !l.startsWith('#'));
            if (!allowed.includes(author.toLowerCase())) {
              return close(`Thank you for wanting to add to Animundo! Only verified contributors can open pull requests. In the game, a grown-up taps **For parents and teachers**, signs in with their email (it's free) and taps **Get my contributor code**. Post that code in a [Verify me](https://github.com/${owner}/${repo}/issues/new?template=verify-me.yml) issue. After that, open your pull request again.`);
            }

            // content only, and only data file types: a scene, script or workflow can never come in
            const isContent = f => /^(regions|animals)\/[a-z0-9_]+\.json$/.test(f)
              || /^models\/(plants\/|trees\/)?[a-z0-9_]+\.json$/.test(f)
              || /^models\/previews\/(plants\/)?[a-z0-9_]+\.png$/.test(f)
              || /^models\/trees\/previews\/[a-z0-9_]+\.png$/.test(f)
              || /^locale\/[a-z]{2,3}(-[A-Za-z]+)?\/(animals|food|plants|regions)\.json$/.test(f)   // menu text belongs to the game repo (decision 0013)
              || ['wanted.json', 'docs/catalogue.md', 'poisonous-plants.json'].includes(f);
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            // a renamed file counts under both names, so nothing can be moved out of place
            const names = files.flatMap(f => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
            const outside = [...new Set(names.filter(f => !isContent(f)))];
            if (outside.length) {
              return close(`Pull requests can only change content: place, animal and model files (\`.json\`), preview sheets (\`.png\`), the animal, food, plant and place text in \`locale/\`, \`wanted.json\`, \`docs/catalogue.md\` and additions to \`poisonous-plants.json\`. This one also changes:\n\n${outside.map(f => '- `' + f + '`').join('\n')}\n\nIf something else needs changing, please open an issue instead.`);
            }

            // the poisonous plant list only grows: an addition is fine, a removal is for the owner
            const poison = files.find(f => f.filename === 'poisonous-plants.json' || f.previous_filename === 'poisonous-plants.json');
            if (poison && (poison.status !== 'modified' || /^-\s*\{/m.test(poison.patch || ''))) {
              return close(`Plants can be added to \`poisonous-plants.json\`, never removed. If an entry is wrong, please open an issue.`);
            }

            // every commit is signed off (DCO): the contributor may send it, under the repository's licences
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number });
            const unsigned = commits.filter(c => !/^Signed-off-by: .+ <.+>$/m.test(c.commit.message));
            if (unsigned.length) {
              return close(`Every commit needs a sign-off line, which says you agree to the [Developer Certificate of Origin](https://developercertificate.org) and share your work under this repository's licences. Add it with \`git commit -s\` (or \`git commit --amend -s\` and a force push), then open this pull request again. Not signed off: ${unsigned.map(c => c.sha.slice(0, 7)).join(', ')}.`);
            }

            const limit = author.toLowerCase() === BOT ? 10 : 2;
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open' });
            const mine = open.filter(p => p.user.login === author && p.number !== pr.number);
            if (mine.length >= limit) {
              return close(`You already have ${limit === 2 ? 'two' : limit} pull requests open (${mine.map(p => '#' + p.number).join(', ')}). Please wait until one of them is merged or closed, then open this one again.`);
            }
