name: Sync to the game
# animundo-world is the source of the game's content (decision 0013). Every push
# to main copies it into the game repo (Kaimaan/animundo) with
# tools/export_to_game.sh and pushes, which deploys the game.
# - Stops if someone changed content in the game repo instead of here
#   (tools/check_game_drift.sh), so nobody's work is overwritten.
# - Builds the models whose spec or animal file changed, in Blender. The preview
#   sheets come from the pull request, as reviewed.
# Writes with a deploy key that only works for the game repo (secret GAME_DEPLOY_KEY).
# The key is only on disk for the clone and the final push, never while Blender
# runs content, and only the mirror paths may be committed (a merged file can't
# add a workflow or code to the game).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every model, not only the changed ones
        type: boolean
        default: false

concurrency:
  group: sync-to-game
  cancel-in-progress: false   # every sync lands, in order

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: world
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Kaimaan/animundo
          ssh-key: ${{ secrets.GAME_DEPLOY_KEY }}
          persist-credentials: false   # gone before any content is built
          path: game

      - name: Stop if content was changed in the game repo
        run: world/tools/check_game_drift.sh game

      - name: Find models to build
        id: models
        working-directory: world
        run: |
          base=$(cat ../game/.world-sync)
          changed=$(git diff --name-only "$base" HEAD)
          if [ "${{ inputs.rebuild_all }}" = "true" ] || echo "$changed" | grep -q '^tools/blender/'; then
            specs=$(ls models/*.json models/plants/*.json; ls models/trees/*.json 2>/dev/null || true)   # no tree specs yet is fine
          else
            specs=$(for f in $changed; do
              case "$f" in
                models/*.json) [ -f "$f" ] && echo "$f" ;;   # animals, plants/ and trees/
                animals/*.json) s="models/$(basename "$f")"; [ -f "$s" ] && echo "$s" ;;
              esac
            done | sort -u)
          fi
          # only plain spec names reach the build (a file name is never run as shell)
          specs=$(printf '%s\n' $specs | grep -E '^models/(plants/|trees/)?[a-z][a-z0-9_]*\.json$' || true)
          echo "specs=$(echo $specs)" >> "$GITHUB_OUTPUT"
          echo "To build: ${specs:-nothing}"

      - name: Cache Blender
        if: steps.models.outputs.specs != ''
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.2-linux-x64

      - name: Build models
        if: steps.models.outputs.specs != ''
        working-directory: world
        env:
          BLENDER: /home/runner/blender/blender
          SPECS: ${{ steps.models.outputs.specs }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libgl1 libegl1 > /dev/null
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sL https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
          fi
          tools/build_model.sh $SPECS
          git checkout -- models/previews $(ls -d models/trees/previews 2>/dev/null)   # keep the reviewed preview sheets

      - name: Copy into the game repo
        run: world/tools/export_to_game.sh "$GITHUB_WORKSPACE/game" --stamp

      - name: Commit and push if anything changed
        working-directory: game
        env:
          DEPLOY_KEY: ${{ secrets.GAME_DEPLOY_KEY }}
        run: |
          # the mirror paths only (decision 0013); anything else changed is refused
          git add -A -- regions animals models homes biomes food lands locale assets/animals assets/plants $(ls -d assets/trees 2>/dev/null) assets/world/map-animals.json ART.md wanted.json \
            docs/animals-wanted.md docs/catalogue.md tools/validate_region.py tools/build_model.sh \
            tools/catalogue.py tools/blender $(ls -d tests/tile_region 2>/dev/null) .world-sync
          outside=$(git diff --name-only; git ls-files --others --exclude-standard)
          if [ -n "$outside" ]; then
            echo "::error::The sync changed files outside the content mirror:"; echo "$outside"
            exit 1
          fi
          if git diff --cached --quiet -- . ':!.world-sync'; then
            echo "The game repo is already up to date"
            exit 0
          fi
          git config user.name "animundo-sync"
          git config user.email "animundo-sync@users.noreply.github.com"
          msg=$(git -C ../world log -1 --format=%s)
          git commit -q -m "Content from animundo-world ${GITHUB_SHA::7}: $msg" -m "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/game_key
          chmod 600 ~/.ssh/game_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/game_key -o IdentitiesOnly=yes"
          git remote set-url origin git@github.com:Kaimaan/animundo.git
          for i in 1 2 3 4 5; do
            git push -q && { git log --oneline -1; exit 0; }
            git pull -q --rebase
          done
          echo "::error::Could not push to the game repo"
          exit 1
