name: Verify me
description: Become a contributor so you can open pull requests.
title: "Verify me"
body:
  - type: markdown
    attributes:
      value: |
        In the game, tap **For parents and teachers** on the title screen. You need a grown-up's account: sign in with your email there if you haven't (it's free). Then tap **Get my contributor code** and post the code below. It works once, for 7 days.
        A bot checks the code and lets your GitHub name open pull requests. It doesn't keep which player or email the code came from.
        Use a nickname on GitHub, never a child's full name. Children take part through a parent, guardian or teacher.
  - type: input
    id: code
    attributes:
      label: Your contributor code
      placeholder: ABCD-EFGH
    validations:
      required: true
